<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Input line -->
  <line x1="4" y1="32" x2="14" y2="32" stroke="#ffb000" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Buffer/enable gate triangle — input left vertex, output right vertex -->
  <path d="M 14,14 L 14,50 L 48,32 Z" stroke="#ffb000" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Gating dot on output — the controlled exit -->
  <circle cx="51.5" cy="32" r="3.5" fill="#06070b" stroke="#ffb000" stroke-width="2"/>
  <!-- Output line from dot -->
  <line x1="55" y1="32" x2="62" y2="32" stroke="#ffb000" stroke-width="2.5" stroke-linecap="round"/>
</svg>
