<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Octagon — authority seal shape -->
  <!-- Vertices at radius 26 from center 32,32, starting at 22.5° -->
  <polygon
    points="56,42 42,56 22,56 8,42 8,22 22,8 42,8 56,22"
    stroke="#ffb000" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Stylized C / open bracket inside — authority mark -->
  <!-- Arc: radius 12 centered at 32,32, gap opens right -->
  <!-- Right-opening C: from (32+12*cos(315°), 32+12*sin(315°)) = (40.5, 23.5) -->
  <!--                   to (32+12*cos(45°), 32+12*sin(45°)) = (40.5, 40.5) -->
  <!-- Large arc, counter-clockwise sweep=0 -->
  <path d="M 40.5,23.5 A 12,12 0 1,0 40.5,40.5" stroke="#ffb000" stroke-width="2.5" stroke-linecap="round"/>
</svg>
