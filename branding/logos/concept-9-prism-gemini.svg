  <line x1="4" y1="26" x2="28" y2="32" stroke="#ffb000" stroke-width="1.5" stroke-linecap="round" opacity="0.55"/>
  <line x1="4" y1="32" x2="28" y2="32" stroke="#ffb000" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <line x1="4" y1="38" x2="28" y2="32" stroke="#ffb000" stroke-width="1.5" stroke-linecap="round" opacity="0.55"/>
  <line x1="4" y1="46" x2="28" y2="32" stroke="#ffb000" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
  <!-- Kernel focal point -->
  <circle cx="32" cy="32" r="5" fill="#ffb000"/>
  <!-- Single controlled output line -->
  <line x1="37" y1="32" x2="60" y2="32" stroke="#ffb000" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Output arrowhead -->
