<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" style="background-color: #06070b">
  <!-- The Hard Financial Limit (Stripe/Custodian Ceiling) -->
  <line x1="12" y1="18" x2="52" y2="18" stroke="#ffb000" stroke-width="3" stroke-linecap="round"/>
  
  <!-- The Velocity / AI Speed (Hermes/Nvidia) -->
  <!-- These represent fast-moving data or agency, surging upwards but strictly halted before the limit -->
  
  <!-- Core surge -->
  <path d="M32 54 L32 26 L38 34" stroke="#ffb000" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Left wing/feather -->
  <path d="M22 46 L22 26 L28 34" stroke="#ffb000" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Right wing/feather -->
  <path d="M42 48 L42 26 L48 34" stroke="#ffb000" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
