<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer ring — complete, very dim (agent space) -->
  <circle cx="32" cy="32" r="28" stroke="#ffb000" stroke-width="1.5" opacity="0.25"/>
  <!-- Middle ring — arc with gap at top (policy boundary) -->
  <!-- Gap ±30° from top. Radius 19. Gap points: -->
  <!-- Right: 32+19*cos(300°)=32+9.5=41.5, 32+19*sin(300°)=32-16.5=15.5 -->
  <!-- Left:  32+19*cos(240°)=32-9.5=22.5, 32-16.5=15.5 -->
  <path d="M 41.5,15.5 A 19,19 0 1,1 22.5,15.5" stroke="#ffb000" stroke-width="2" stroke-linecap="round" opacity="0.65"/>
  <!-- Inner solid circle — the kernel core -->
  <circle cx="32" cy="32" r="9" fill="#ffb000"/>
  <!-- C cutout hint in inner circle — optional small notch -->
  <circle cx="32" cy="32" r="5" fill="#06070b"/>
  <circle cx="34" cy="32" r="5" fill="#ffb000"/>
</svg>
