<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Card - Payment Governance Demo</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; background: #020204; font-family: 'Space Grotesk', sans-serif; overflow: hidden; color: #fff; }

        .bg {
            position: absolute; inset: 0;
            background:
                radial-gradient(circle at 30% 50%, rgba(46, 230, 166, 0.07) 0%, transparent 55%),
                radial-gradient(circle at 70% 50%, rgba(255, 176, 0, 0.07) 0%, transparent 55%);
        }

        .vignette {
            position: absolute; inset: 0;
            background: radial-gradient(circle at center, transparent 40%, #020204 100%);
            z-index: 5; pointer-events: none;
        }

        .container {
            position: relative; z-index: 10;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            height: 100%; padding: 60px 160px; text-align: center;
            gap: 0;
        }

        .eyebrow {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            letter-spacing: 0.45rem;
            text-transform: uppercase;
            color: #2ee6a6;
            margin-bottom: 28px;
            opacity: 0;
            animation: fadeUp 0.8s ease forwards 0.2s;
        }

        .headline {
            font-size: 3.8rem;
            font-weight: 700;
            line-height: 1.1;
            margin-bottom: 40px;
            background: linear-gradient(180deg, #ffffff 0%, #8d93a6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            opacity: 0;
            animation: fadeUp 0.8s ease forwards 0.5s;
        }

        .divider {
            width: 60px; height: 1px;
            background: linear-gradient(90deg, transparent, rgba(46,230,166,0.6), transparent);
            margin-bottom: 36px;
            opacity: 0;
            animation: fadeUp 0.8s ease forwards 0.8s;
        }

        .scenarios {
            display: flex;
            gap: 20px;
            opacity: 0;
            animation: fadeUp 0.8s ease forwards 1.0s;
        }

        .scenario {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9rem;
            letter-spacing: 0.15rem;
            text-transform: uppercase;
            padding: 10px 24px;
            border-radius: 3px;
            border: 1px solid;
        }

        .s-earn  { color: #2ee6a6; border-color: rgba(46,230,166,0.35); background: rgba(46,230,166,0.07); }
        .s-spend { color: #ffb000; border-color: rgba(255,176,0,0.35);  background: rgba(255,176,0,0.07); }
        .s-kill  { color: #ff6060; border-color: rgba(255,60,60,0.35);  background: rgba(255,60,60,0.07); }
        .s-refund{ color: #a99bff; border-color: rgba(169,155,255,0.35);background: rgba(169,155,255,0.07); }

        .sub {
            margin-top: 36px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.78rem;
            letter-spacing: 0.2rem;
            color: rgba(255,255,255,0.3);
            text-transform: uppercase;
            opacity: 0;
            animation: fadeUp 0.8s ease forwards 1.4s;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(16px); }
            to   { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="bg"></div>
    <div class="vignette"></div>
    <div class="container">
        <div class="eyebrow">Payment Governance Demo</div>
        <h1 class="headline">Four scenarios.<br>Every one kernel-enforced.</h1>
        <div class="divider"></div>
        <div class="scenarios">
            <div class="scenario s-earn">Earn</div>
            <div class="scenario s-spend">Spend</div>
            <div class="scenario s-kill">Kill</div>
            <div class="scenario s-refund">Refund</div>
        </div>
        <div class="sub">Operator panel walkthrough · Scripted simulation</div>
    </div>
</body>
</html>
