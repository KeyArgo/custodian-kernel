<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custodian - Cinematic Splash</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; background: #020204; font-family: 'Space Grotesk', sans-serif; overflow: hidden; color: #fff; }
        
        /* Deep cinematic background */
        .bg {
            position: absolute; inset: 0;
            background: 
                radial-gradient(circle at 50% 120%, rgba(255, 176, 0, 0.15) 0%, transparent 60%),
                radial-gradient(circle at 50% -20%, rgba(46, 230, 166, 0.1) 0%, transparent 60%);
            z-index: 1;
        }

        /* 3D Cyber Grid */
        .grid-container {
            position: absolute; inset: 0;
            perspective: 600px;
            z-index: 2;
            opacity: 0.4;
        }

        .grid {
            position: absolute;
            width: 200%; height: 200%;
            left: -50%; top: -50%;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 50px 50px;
            transform: rotateX(75deg) translateY(0) translateZ(-200px);
            animation: gridMove 15s linear infinite;
        }

        /* Ambient glowing particles */
        .particles {
            position: absolute; inset: 0; z-index: 3;
            background-image: radial-gradient(rgba(255, 176, 0, 0.3) 1px, transparent 1px);
            background-size: 120px 120px;
            background-position: 0 0;
            animation: particleFloat 40s linear infinite;
            opacity: 0.2;
        }

        @keyframes particleFloat {
            100% { background-position: 1000px 1000px; }
        }

        /* Sweeping Kernel Scanline */
        .scanner {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 2px;
            background: linear-gradient(90deg, transparent, rgba(255, 176, 0, 0.8), rgba(46, 230, 166, 0.8), transparent);
            box-shadow: 0 0 20px rgba(255, 176, 0, 0.5), 0 0 40px rgba(46, 230, 166, 0.3);
            z-index: 4;
            animation: scan 6s ease-in-out infinite alternate;
            opacity: 0.6;
        }

        @keyframes scan {
            0% { transform: translateY(-10px); }
            100% { transform: translateY(100vh); }
        }

        .container {
            position: relative; z-index: 10;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100%; padding: 40px; text-align: center;
        }

        /* Cinematic reveals */
        .reveal {
            opacity: 0;
            transform: translateY(40px) scale(0.97);
            animation: cinematicReveal 2.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes cinematicReveal {
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .delay-1 { animation-delay: 0.5s; }
        .delay-2 { animation-delay: 1.5s; }
        .delay-3 { animation-delay: 2.5s; }
        .delay-4 { animation-delay: 3.3s; }

        .winner-badge {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1rem;
            letter-spacing: 0.25rem;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.7);
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.03), transparent);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px 40px;
            margin-bottom: 60px;
        }

        .logo-container {
            margin-bottom: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            position: relative;
        }

        /* Pulsing aura behind the logo */
        .logo-container::after {
            content: '';
            position: absolute;
            width: 250px; height: 250px;
            background: radial-gradient(circle, rgba(255, 176, 0, 0.15) 0%, transparent 70%);
            z-index: -1;
            animation: pulseGlow 4s infinite alternate;
        }

        @keyframes pulseGlow {
            0% { transform: scale(0.8); opacity: 0.5; }
            100% { transform: scale(1.3); opacity: 1; }
        }

        .logo-container img {
            height: 180px;
            width: auto;
            display: block;
            margin: 0 auto;
            filter: drop-shadow(0 0 40px rgba(255, 176, 0, 0.3)) brightness(1.2);
        }

        h1 {
            font-size: 6.5rem;
            font-weight: 700;
            margin-bottom: 10px;
            background: linear-gradient(180deg, #ffffff 0%, #8d93a6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -2px;
            text-shadow: 0 30px 60px rgba(0,0,0,0.9);
        }

        .subtitle {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.3rem;
            color: #2ee6a6;
            margin-bottom: 80px;
            max-width: 800px;
            letter-spacing: 0.15rem;
            text-transform: uppercase;
            text-shadow: 0 0 30px rgba(46, 230, 166, 0.5);
        }

        .tech-stack {
            display: flex;
            gap: 40px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9rem;
            letter-spacing: 0.2rem;
            text-transform: uppercase;
        }

        .tech-item {
            padding: 14px 28px;
            border-radius: 4px;
            border-left: 2px solid;
            background: linear-gradient(90deg, rgba(255, 255, 255, 0.04) 0%, transparent 100%);
            position: relative;
            overflow: hidden;
            opacity: 0;
            animation: slideInRight 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            backdrop-filter: blur(5px);
        }

        @keyframes slideInRight {
            from { opacity: 0; transform: translateX(-40px); }
            to { opacity: 1; transform: translateX(0); }
        }

        /* Glass sweeping light effect */
        .tech-item::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
            animation: sweep 4s infinite;
        }

        @keyframes sweep {
            0% { left: -100%; }
            50% { left: 100%; }
            100% { left: 100%; }
        }

        .tech-stack { flex-wrap: wrap; justify-content: center; max-width: 1400px; }

        /* Staggered load for tech stack */
        .t-1 { border-color: #76b900; color: #76b900; animation-delay: 4.2s; }
        .t-2 { border-color: #a99bff; color: #a99bff; animation-delay: 4.4s; }
        .t-3 { border-color: #ffb000; color: #ffb000; animation-delay: 4.6s; }
        .t-4 { border-color: #2ee6a6; color: #2ee6a6; animation-delay: 4.8s; }
        .t-5 { border-color: #76b900; color: #76b900; animation-delay: 5.0s; }
        .t-6 { border-color: #a99bff; color: #a99bff; animation-delay: 5.2s; }
        .t-7 { border-color: #ffb000; color: #ffb000; animation-delay: 5.4s; }
        
        /* Deep shadow vignette for that movie theater feel */
        .vignette {
            position: absolute; inset: 0;
            background: radial-gradient(circle at center, transparent 30%, #020204 100%);
            z-index: 5;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="bg"></div>
    <div class="grid-container">
        <div class="grid"></div>
    </div>
    <div class="particles"></div>
    <div class="scanner"></div>
    <div class="vignette"></div>
    
    <div class="container">
        <div class="winner-badge reveal delay-1">Hermes Accelerated Business Hackathon 2026</div>
        
        <div class="logo-container reveal delay-2">
            <img src="custodian-logo-vector.svg" alt="Custodian Logo">
        </div>
        
        <h1 class="reveal delay-3">CUSTODIAN</h1>
        <p class="subtitle reveal delay-4">Kernel-Enforced Authority</p>
        
        <div class="tech-stack">
            <div class="tech-item t-1">NVIDIA Nemotron 120B</div>
            <div class="tech-item t-2">NemoClaw · OpenRouter · NIM</div>
            <div class="tech-item t-3">Stripe Live Payments</div>
            <div class="tech-item t-4">L0 · L1 · L2 · L3 Bands</div>
            <div class="tech-item t-5">SHA-256 Receipts</div>
            <div class="tech-item t-6">Kernel Enforcement</div>
        </div>
    </div>
</body>
</html>
