<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Card - Live Kernel Run</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; background: #020204; font-family: 'Space Grotesk', sans-serif; overflow: hidden; color: #fff; }

        .bg {
            position: absolute; inset: 0;
            background:
                radial-gradient(circle at 50% 60%, rgba(255, 176, 0, 0.1) 0%, transparent 55%),
                radial-gradient(circle at 50% -10%, rgba(255, 60, 60, 0.06) 0%, transparent 50%);
        }

        .vignette {
            position: absolute; inset: 0;
            background: radial-gradient(circle at center, transparent 40%, #020204 100%);
            z-index: 5; pointer-events: none;
        }

        .live-pill {
            position: absolute;
            top: 48px; right: 60px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            letter-spacing: 0.2rem;
            text-transform: uppercase;
            color: #ff4444;
            display: flex; align-items: center; gap: 8px;
            opacity: 0;
            animation: fadeIn 0.5s ease forwards 0.3s;
            z-index: 20;
        }

        .live-dot {
            width: 8px; height: 8px;
            background: #ff4444;
            border-radius: 50%;
            animation: pulse 1.2s infinite;
        }

        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

        .container {
            position: relative; z-index: 10;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            height: 100%; padding: 60px 160px; text-align: center;
        }

        .eyebrow {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            letter-spacing: 0.45rem;
            text-transform: uppercase;
            color: #ffb000;
            margin-bottom: 28px;
            opacity: 0;
            animation: fadeUp 0.8s ease forwards 0.2s;
        }

        .headline {
            font-size: 3.8rem;
            font-weight: 700;
            line-height: 1.15;
            margin-bottom: 36px;
            opacity: 0;
            animation: fadeUp 0.8s ease forwards 0.5s;
        }

        .headline .white { color: #fff; }
        .headline .gold  {
            background: linear-gradient(90deg, #ffb000, #ff8c00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .proof-row {
            display: flex;
            gap: 16px;
            margin-bottom: 0;
            opacity: 0;
            animation: fadeUp 0.8s ease forwards 0.9s;
        }

        .proof {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            letter-spacing: 0.1rem;
            padding: 8px 20px;
            border-radius: 3px;
            border: 1px solid rgba(255,176,0,0.3);
            background: rgba(255,176,0,0.08);
            color: #ffb000;
            text-transform: uppercase;
        }

        .sub {
            margin-top: 32px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.78rem;
            letter-spacing: 0.2rem;
            color: rgba(255,255,255,0.3);
            text-transform: uppercase;
            opacity: 0;
            animation: fadeUp 0.8s ease forwards 1.3s;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(16px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to   { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="bg"></div>
    <div class="vignette"></div>
    <div class="live-pill"><span class="live-dot"></span>Live</div>
    <div class="container">
        <div class="eyebrow">Live Kernel Run</div>
        <h1 class="headline">
            <span class="white">Real $35. Real SMS.</span><br>
            <span class="gold">Not a mock. Not a stub.</span>
        </h1>
        <div class="proof-row">
            <div class="proof">Live Stripe</div>
            <div class="proof">Live Twilio</div>
            <div class="proof">SHA-256 Receipts</div>
        </div>
        <div class="sub">The kernel ran this · Audit log on-chain</div>
    </div>
</body>
</html>
