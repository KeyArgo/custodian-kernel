<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Custodian Splash v2</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1920px; height:1080px; background:#060604; overflow:hidden; font-family:'DejaVu Sans', sans-serif; }

  .bg {
    position:absolute; inset:0;
    background:
      radial-gradient(circle at 50% 115%, rgba(255,176,0,0.16) 0%, transparent 55%),
      radial-gradient(circle at 50% -15%, rgba(46,230,166,0.08) 0%, transparent 55%),
      #060604;
  }

  .grid-wrap {
    position:absolute; inset:0;
    perspective:700px;
    perspective-origin:50% 20%;
    opacity:0.55;
  }
  .grid {
    position:absolute; width:250%; height:250%; left:-75%; top:15%;
    background-image:
      linear-gradient(rgba(255,255,255,0.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.06) 1px, transparent 1px);
    background-size:54px 54px;
    transform:rotateX(78deg) translateZ(0px);
  }

  .vignette {
    position:absolute; inset:0;
    background:radial-gradient(circle at 50% 46%, transparent 35%, #060604 100%);
  }

  .container {
    position:relative; z-index:10;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    height:100%; text-align:center;
  }

  .logo-wrap { position:relative; margin-bottom:34px; }
  .logo-glow {
    content:''; position:absolute; left:50%; top:50%; width:280px; height:280px;
    transform:translate(-50%,-50%);
    background:radial-gradient(circle, rgba(255,176,0,0.28) 0%, transparent 70%);
  }
  .logo-wrap svg { width:140px; height:140px; position:relative; filter:drop-shadow(0 0 30px rgba(255,176,0,0.45)); }

  h1 {
    font-size:7.2rem; font-weight:800; letter-spacing:-2px;
    background:linear-gradient(180deg, #fff 0%, #9aa0b3 100%);
    -webkit-background-clip:text; -webkit-text-fill-color:transparent;
    text-shadow:0 40px 70px rgba(0,0,0,0.9);
  }

  .subtitle {
    font-family:'DejaVu Sans Mono', monospace; font-size:1.5rem; letter-spacing:0.12rem;
    color:#2ee6a6; text-transform:uppercase; margin-top:14px; margin-bottom:70px;
    text-shadow:0 0 26px rgba(46,230,166,0.5);
  }

  .counter-label {
    font-family:'DejaVu Sans Mono', monospace; font-size:0.95rem; letter-spacing:0.3rem;
    color:rgba(255,255,255,0.45); text-transform:uppercase; margin-bottom:10px;
  }
  .counter {
    font-family:'DejaVu Sans Mono', monospace; font-size:3.2rem; font-weight:700;
    color:#ffb000; text-shadow:0 0 24px rgba(255,176,0,0.5);
    font-variant-numeric:tabular-nums;
  }

  .footer-link {
    margin-top:56px; font-family:'DejaVu Sans Mono', monospace; font-size:1.1rem;
    color:rgba(255,255,255,0.55); letter-spacing:0.04rem;
    padding-top:22px; border-top:1px solid rgba(255,255,255,0.12); width:640px;
  }

  .scanner {
    position:absolute; left:0; width:100%; height:2px; top:0;
    background:linear-gradient(90deg, transparent, rgba(255,176,0,0.9), rgba(46,230,166,0.7), transparent);
    box-shadow:0 0 24px rgba(255,176,0,0.5);
  }

  [data-reveal] { opacity:0; will-change:opacity,transform; }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="grid-wrap"><div class="grid" id="grid"></div></div>
  <div class="scanner" id="scanner" data-reveal data-delay="400" data-dur="1600" data-kind="scan"></div>
  <div class="vignette"></div>

  <div class="container">
    <div class="logo-wrap" data-reveal data-delay="150" data-dur="900" data-kind="pop">
      <div class="logo-glow" id="logoGlow"></div>
      <svg viewBox="0 0 64 64" fill="none">
        <polygon points="56,42 42,56 22,56 8,42 8,22 22,8 42,8 56,22" stroke="#ffb000" stroke-width="2.5" stroke-linejoin="round"/>
        <path d="M 40.5,23.5 A 12,12 0 1,0 40.5,40.5" stroke="#ffb000" stroke-width="2.5" stroke-linecap="round"/>
      </svg>
    </div>
    <h1 data-reveal data-delay="500" data-dur="900" data-kind="rise">CUSTODIAN</h1>
    <div class="subtitle" data-reveal data-delay="1000" data-dur="800" data-kind="fadeUp">Codex Guard &middot; The authority kernel for AI agents</div>
    <div class="counter-block" data-reveal data-delay="1350" data-dur="800" data-kind="fadeUp">
      <div class="counter-label">Decisions Recorded</div>
      <div class="counter" id="counter">000</div>
    </div>
    <div class="footer-link" data-reveal data-delay="1700" data-dur="800" data-kind="fadeUp">github.com/KeyArgo/custodian-codex-guard</div>
  </div>

  <script>
    const easeOutCubic = p => 1 - Math.pow(1 - p, 3);
    const easeOutBack = p => { const c1=1.70158, c3=c1+1; return 1 + c3*Math.pow(p-1,3) + c1*Math.pow(p-1,2); };

    const revealEls = Array.from(document.querySelectorAll('[data-reveal]')).map(el => ({
      el,
      delay: +el.dataset.delay,
      dur: +el.dataset.dur,
      kind: el.dataset.kind
    }));

    const counterEl = document.getElementById('counter');
    const counterDelay = 1350, counterDur = 2600, counterTarget = 128;

    const logoGlow = document.getElementById('logoGlow');
    const grid = document.getElementById('grid');
    const scannerEl = document.getElementById('scanner');

    const TICK_MS = 33;
    let elapsed = 0;
    function frame() {
      elapsed += TICK_MS;
      const t = elapsed;

      for (const r of revealEls) {
        const p = Math.max(0, Math.min(1, (t - r.delay) / r.dur));
        if (p <= 0) { r.el.style.opacity = 0; continue; }
        r.el.style.opacity = String(p);
        if (r.kind === 'pop') {
          const e = easeOutBack(p);
          r.el.style.transform = `scale(${0.7 + 0.3 * e})`;
        } else if (r.kind === 'rise') {
          const e = easeOutCubic(p);
          r.el.style.transform = `translateY(${30 * (1 - e)}px)`;
        } else if (r.kind === 'fadeUp') {
          const e = easeOutCubic(p);
          r.el.style.transform = `translateY(${16 * (1 - e)}px)`;
        } else if (r.kind === 'scan') {
          r.el.style.transform = `translateY(${p * 1080}px)`;
          r.el.style.opacity = String(0.9 * (1 - p));
        }
      }

      // logo pulse glow (continuous, 3s period)
      const pulseP = (t / 1500) % 2;
      const pulseWave = pulseP < 1 ? pulseP : 2 - pulseP;
      logoGlow.style.transform = `translate(-50%,-50%) scale(${0.9 + 0.25 * pulseWave})`;
      logoGlow.style.opacity = String(0.6 + 0.4 * pulseWave);

      // grid drift (continuous)
      const driftY = (t / 14000) * 540 % 540;
      grid.style.backgroundPosition = `0 ${driftY}px`;

      // counter tick
      if (t >= counterDelay) {
        const p = Math.min(1, (t - counterDelay) / counterDur);
        const eased = 1 - Math.pow(1 - p, 3);
        counterEl.textContent = String(Math.round(eased * counterTarget)).padStart(3, '0');
      }
    }
    setInterval(frame, TICK_MS);
    frame();
  </script>
</body>
</html>
