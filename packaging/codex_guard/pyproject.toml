[project]
name = "custodian-codex-guard"
version = "0.1.2"
description = "Policy guard for Codex CLI: evaluate coding-agent actions before execution"
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "InovinLabs", email = "hello@inovinlabs.com"}]
keywords = ["codex", "guard", "policy", "agent", "enforcement"]
dependencies = [
    "custodian-kernel>=0.4.0,<0.5",
    "cryptography>=42.0",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Topic :: Software Development :: Libraries",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.urls]
Homepage = "https://getcustodian.xyz"
Repository = "https://github.com/KeyArgo/custodian-codex-guard"
Documentation = "https://getcustodian.xyz/docs"
Issues = "https://github.com/KeyArgo/custodian-codex-guard/issues"
Security = "https://github.com/KeyArgo/custodian-codex-guard/blob/main/SECURITY.md"

[project.scripts]
custodian-codex = "custodian.codex_guard.cli:main"
custodian-codex-guard-mcp = "custodian.codex_guard.mcp_server:main"
custodian-codex-guard-hook = "custodian.codex_guard.hook:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["custodian.codex_guard", "custodian.codex_guard.*"]
namespaces = true

[tool.setuptools.package-data]
"custodian.codex_guard" = [
    "*.md",
    "bundled_plugin/.agents/plugins/marketplace.json",
    "bundled_plugin/plugins/custodian-codex-guard/.mcp.json",
    "bundled_plugin/plugins/custodian-codex-guard/.codex-plugin/plugin.json",
    "bundled_plugin/plugins/custodian-codex-guard/README.md",
    "bundled_plugin/plugins/custodian-codex-guard/skills/govern-codex/SKILL.md",
]
