[project]
name = "custodian-kernel"
version = "0.5.0"
description = "Kernel-enforced authority and spend platform for AI agents"
requires-python = ">=3.11"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "InovinLabs", email = "hello@inovinlabs.com"}]
keywords = ["ai", "agent", "authority", "spend", "kernel", "enforcement"]
dependencies = ["pyyaml", "requests", "cryptography>=42.0", "tzdata"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Topic :: Software Development :: Libraries",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.urls]
Homepage = "https://getcustodian.xyz"
Repository = "https://github.com/KeyArgo/custodian-kernel"
Documentation = "https://getcustodian.xyz/docs"
Issues = "https://github.com/KeyArgo/custodian-kernel/issues"
Changelog = "https://github.com/KeyArgo/custodian-kernel/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "build",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "flask",
    "boto3",
    "pymongo",
    "mongomock",
    "twine",
]

[project.scripts]
custodian = "custodian.cli.main:main"
custodian-verify = "custodian.verify_kit:main"
paladin = "paladin.cli:main"
paladin-import = "paladin.cli:main_import"
# Harness guards ship in the same wheel: one install = kernel + all guards.
custodian-codex = "custodian.guards.codex.cli:main"
custodian-codex-guard-mcp = "custodian.guards.codex.mcp_server:main"
custodian-claude = "custodian.guards.claude.cli:main"
custodian-claude-guard = "custodian.guards.claude.cli:main"
custodian-hermes = "custodian.guards.hermes.cli:main"
custodian-hermes-guard = "custodian.guards.hermes.cli:main"

[project.entry-points."hermes_agent.plugins"]
custodian-hermes-guard = "custodian.guards.hermes.plugin"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["custodian*", "paladin*"]

[tool.setuptools.package-data]
"custodian" = [
    "bundled_skills/**/*",
    "bundled_skills/**",
    "packs/**/corpus/*.json",
    "packs/**/*.yaml",
    "packs/**/*.json",
    "policy/presets/*.yaml",
    "guards/hermes/plugin/*.yaml",
    "guards/claude/corpus/*.json",
]
