name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest tests/ -v --cov=custodian
      - name: Security self-hardening gate (the guard graded against itself)
        # Two standing gates, run on every OS/Python:
        #  - mutation gate: flip each security-critical decision in a mutated
        #    copy and prove a concrete input catches it (surviving mutant = an
        #    untested enforcement line = build fails).
        #  - gate corpus + fresh hunt: replay every frozen bypass (a fixed hole
        #    may never reopen -- monotonic ratchet) AND re-run the adversarial
        #    generator so the guard is graded against the whole attack surface.
        # "It works" is the last line of this step, not a claim.
        run: pytest tests/test_guard_mutation_gate.py tests/test_guard_gate_corpus.py -v

  build:
    # Prove the wheel installs clean and the flagship verify runs from it,
    # on both OSes — the exact path a `pip install custodian-kernel` user hits.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel
        run: |
          pip install build
          python -m build
      - name: Install from wheel (clean)
        run: pip install dist/*.whl
        shell: bash
      - name: Smoke test the installed CLI
        # Exercises the first commands a real user types, from the wheel —
        # `init` caught a missing-package-data bug that source-tree tests
        # can never see (0.1.2–0.3.1 all shipped with init broken).
        run: |
          custodian --version
          custodian tools summary
          custodian demo verify
          mkdir smoke-ws && cd smoke-ws
          custodian init
          custodian request --amount 1.00 --description "smoke"
          custodian backup ../smoke-backup.zip
          mkdir ../smoke-ws2 && cd ../smoke-ws2
          custodian restore ../smoke-backup.zip
          custodian status
        shell: bash
      - name: Every registered (sub)command must work from a clean install
        # The 0.4.0 incident: custodian.codex_guard was missing from the
        # actual published wheel while cli/cmd_console.py and
        # cli/cmd_codex_guard.py both imported from it at module level, so
        # *every* invocation -- --version included -- crashed. The fixed
        # step above only exercises a hand-picked list of commands and
        # would not by itself have caught a different subcommand breaking
        # the same way. This walks the real, live argparse tree (including
        # nested subcommands like `codex-guard receipts`) and confirms
        # every leaf's --help works from a genuinely clean install -- no
        # subcommand can be silently forgotten, since new ones are picked
        # up automatically.
        run: |
          pip install pytest
          pytest tests/test_clean_wheel_install.py -m network -v
        shell: bash
