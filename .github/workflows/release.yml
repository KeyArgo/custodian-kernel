name: Release (disabled safety sentinel)

# Public releases are intentionally not created from the private source
# repository. A reviewed candidate must first pass scripts/custodian-release.py
# and be mirrored byte-for-byte into the matching KeyArgo repository. Publishing
# remains a separate operator-approved operation.
on:
  workflow_dispatch:

permissions: {}

jobs:
  refuse-private-release:
    runs-on: ubuntu-latest
    steps:
      - name: Explain the release boundary
        run: |
          echo "Release refused: this is the private source repository."
          echo "Prepare and review the immutable release manifest, then use the matching KeyArgo repository."
          exit 1
