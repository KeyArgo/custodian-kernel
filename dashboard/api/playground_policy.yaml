# Policy used only by the interactive playground -- demonstrates rule-based
# band assignment (the "critical" checkbox), separate from the real
# production policy.yaml used by the actual sandbox/skill scripts.
version: "1.0"
default_band: L2

bands:
  L2:
    max_spend: 2.00
    requires_approval: false
    approval_backend: twilio_verify
    description: "Standard autonomous band"
  L4:
    max_spend: null
    requires_approval: true
    approval_backend: twilio_verify
    description: "Critical -- always requires approval, regardless of amount"

rules:
  - match:
      context.critical: true
    assign_band: L4

escalation:
  timeout_seconds: 600
  on_timeout: deny
  retry_count: 0
