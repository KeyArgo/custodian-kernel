<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custodian — Autonomous Spend Authority</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1a2e 100%);
            color: #e0e0e0;
            padding: 20px;
            min-height: 100vh;
        }

        .hero {
            max-width: 1100px;
            margin: 0 auto 40px auto;
            text-align: center;
            padding: 50px 20px 40px 20px;
        }

        .credibility-strip {
            color: #6b7280;
            font-size: 0.78em;
            letter-spacing: 0.12em;
            margin-bottom: 28px;
            font-weight: 600;
        }

        .hero-claim {
            font-size: 2.6em;
            font-weight: 700;
            color: #f5f5f5;
            line-height: 1.2;
            margin-bottom: 16px;
            letter-spacing: -0.01em;
        }

        .hero-sub {
            color: #9ca3af;
            font-size: 1.15em;
            max-width: 640px;
            margin: 0 auto 36px auto;
            line-height: 1.5;
        }

        .spec-strip {
            display: inline-flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: rgba(118, 185, 0, 0.06);
            border: 1px solid rgba(118, 185, 0, 0.3);
            border-radius: 10px;
            padding: 12px 22px;
            font-size: 0.85em;
            letter-spacing: 0.04em;
            color: #9fd35c;
            margin-bottom: 50px;
        }
        .spec-item strong { color: #d9f99d; font-weight: 700; }
        .spec-item.enforced { color: #76b900; font-weight: 700; }
        .spec-sep { color: #3f4a2e; }

        .process-diagram {
            display: flex;
            align-items: stretch;
            justify-content: center;
            gap: 6px;
            flex-wrap: wrap;
        }
        .process-step {
            flex: 1;
            min-width: 200px;
            max-width: 240px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            padding: 18px 16px;
            text-align: left;
            position: relative;
            transition: background 0.4s, border-color 0.4s;
        }
        .process-step .stage-dot {
            position: absolute;
            top: 14px;
            right: 14px;
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: rgba(255,255,255,0.15);
        }
        .process-step.is-complete {
            background: rgba(159,211,92,0.07);
            border-color: rgba(159,211,92,0.35);
        }
        .process-step.is-complete .stage-dot {
            background: #9fd35c;
            box-shadow: 0 0 0 3px rgba(159,211,92,0.15);
        }
        .process-step.is-active {
            background: rgba(245,200,80,0.08);
            border-color: rgba(245,200,80,0.5);
        }
        .process-step.is-active .stage-dot {
            background: #f5c850;
            box-shadow: 0 0 0 4px rgba(245,200,80,0.2);
            animation: pulse-dot 1.4s ease-in-out infinite;
        }
        .process-step.is-skipped {
            opacity: 0.4;
        }
        @keyframes pulse-dot {
            0%, 100% { box-shadow: 0 0 0 4px rgba(245,200,80,0.2); }
            50% { box-shadow: 0 0 0 8px rgba(245,200,80,0.05); }
        }
        .process-num {
            color: #4b5e1f;
            font-size: 0.85em;
            font-weight: 700;
            margin-bottom: 4px;
        }
        .process-step.is-complete .process-num { color: #9fd35c; }
        .process-step.is-active .process-num { color: #f5c850; }
        .process-title {
            color: #9fd35c;
            font-weight: 700;
            font-size: 0.95em;
            letter-spacing: 0.05em;
            margin-bottom: 8px;
        }
        .process-desc {
            color: #9ca3af;
            font-size: 0.82em;
            line-height: 1.4;
        }
        .process-status {
            margin-top: 8px;
            font-size: 0.78em;
            font-weight: 700;
            letter-spacing: 0.04em;
            min-height: 1.1em;
        }
        .process-step.is-complete .process-status { color: #9fd35c; }
        .process-step.is-active .process-status { color: #f5c850; }
        .process-arrow {
            display: flex;
            align-items: center;
            color: #4b5e1f;
            font-size: 1.4em;
            padding: 0 2px;
        }
        @media (max-width: 900px) {
            .process-arrow { display: none; }
        }
        .verdict-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 14px;
            margin-top: 18px;
        }
        @media (max-width: 900px) {
            .verdict-grid { grid-template-columns: 1fr; }
        }
        .verdict-card {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.09);
            border-radius: 12px;
            padding: 18px 18px 14px;
            text-align: left;
        }
        .verdict-lens {
            color: #6b7280;
            font-size: 0.72em;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin-bottom: 6px;
        }
        .verdict-headline {
            color: #e5e7eb;
            font-weight: 700;
            font-size: 1.05em;
            line-height: 1.3;
            margin-bottom: 12px;
            min-height: 2.6em;
        }
        .verdict-fact-row {
            display: flex;
            gap: 8px;
            font-family: 'SF Mono', Monaco, monospace;
            font-size: 0.78em;
            padding: 5px 0;
            border-top: 1px solid rgba(255,255,255,0.06);
        }
        .verdict-fact-row:first-of-type { border-top: none; }
        .verdict-fact-key { color: #6b7280; white-space: nowrap; }
        .verdict-fact-val { color: #9ca3af; word-break: break-all; }
        .verdict-badge {
            display: inline-block;
            margin-top: 10px;
            padding: 3px 10px;
            border-radius: 5px;
            font-size: 0.72em;
            font-weight: 700;
            letter-spacing: 0.04em;
        }
        .verdict-badge.pass { background: rgba(159,211,92,0.15); color: #9fd35c; }
        .verdict-badge.hold { background: rgba(245,200,80,0.15); color: #f5c850; }
        .verdict-badge.blocked { background: rgba(239,68,68,0.15); color: #ef4444; }
        .verdict-badge.idle { background: rgba(255,255,255,0.08); color: #6b7280; }

        .nav-links { text-align: center; margin-bottom: 24px; }
        .nav-link {
            display: inline-block;
            margin: 0 10px;
            color: #9fd35c;
            text-decoration: none;
            padding: 6px 14px;
            border: 1px solid rgba(118, 185, 0, 0.3);
            border-radius: 8px;
            font-size: 0.9em;
        }
        .nav-link:hover { background: rgba(118, 185, 0, 0.1); }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
            max-width: 1100px;
            margin: 0 auto 24px auto;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 14px;
            padding: 18px 20px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .card .label {
            font-size: 0.8em;
            color: #9aa5b1;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 6px;
        }

        .card .value {
            font-size: 1.8em;
            font-weight: 600;
            color: #f0f0f0;
        }

        .card.band .value { color: #76b900; }

        .bar-track {
            margin-top: 10px;
            height: 10px;
            border-radius: 5px;
            background: rgba(255,255,255,0.08);
            overflow: hidden;
        }
        .bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #76b900, #9fd35c);
            transition: width 0.4s ease;
        }
        .bar-fill.warn { background: linear-gradient(90deg, #d97706, #f59e0b); }
        .bar-fill.danger { background: linear-gradient(90deg, #b91c1c, #ef4444); }

        .conn-dot {
            display: inline-block;
            width: 9px; height: 9px;
            border-radius: 50%;
            margin-right: 6px;
        }
        .conn-dot.live { background: #22c55e; box-shadow: 0 0 8px #22c55e; }
        .conn-dot.down { background: #ef4444; box-shadow: 0 0 8px #ef4444; }

        .section-title {
            max-width: 1100px;
            margin: 0 auto 12px auto;
            color: #9fd35c;
            font-size: 1.1em;
            letter-spacing: 0.03em;
        }

        .feed {
            max-width: 1100px;
            margin: 0 auto 24px auto;
            background: rgba(255,255,255,0.04);
            border-radius: 14px;
            border: 1px solid rgba(255,255,255,0.08);
            overflow: hidden;
        }

        .event {
            display: flex;
            align-items: baseline;
            gap: 14px;
            padding: 12px 18px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            font-size: 0.92em;
        }
        .event:last-child { border-bottom: none; }

        .event .ts { color: #6b7280; min-width: 150px; font-family: monospace; font-size: 0.85em; }
        .event .badge {
            min-width: 130px;
            text-align: center;
            padding: 3px 10px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.82em;
            text-transform: uppercase;
        }
        .badge.executed { background: rgba(34,197,94,0.15); color: #4ade80; border: 1px solid rgba(34,197,94,0.4); }
        .badge.escalation_required { background: rgba(245,158,11,0.18); color: #fbbf24; border: 1px solid rgba(245,158,11,0.45); animation: pulse 1.6s infinite; }
        .badge.denied { background: rgba(239,68,68,0.15); color: #f87171; border: 1px solid rgba(239,68,68,0.4); }
        .badge.execution_failed { background: rgba(239,68,68,0.15); color: #f87171; border: 1px solid rgba(239,68,68,0.4); }

        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.55; } }

        .event .desc { flex: 1; color: #d1d5db; }
        .event .amount { font-family: monospace; color: #e5e7eb; min-width: 70px; text-align: right; }

        .empty-state { padding: 30px; text-align: center; color: #6b7280; }

        .pending-banner {
            max-width: 1100px;
            margin: 0 auto 24px auto;
            background: rgba(245,158,11,0.1);
            border: 1px solid rgba(245,158,11,0.4);
            border-radius: 12px;
            padding: 14px 20px;
            color: #fbbf24;
            display: none;
        }
        .pending-banner.show { display: block; }

        .sub-note {
            margin-top: 8px;
            font-size: 0.75em;
            color: #6b7280;
        }
        .sub-note.has-override { color: #fbbf24; }

        .footer-note {
            max-width: 1100px;
            margin: 0 auto 24px auto;
            text-align: center;
            color: #6b7280;
            font-size: 0.8em;
        }
        .footer-note code {
            background: rgba(255,255,255,0.08);
            padding: 1px 5px;
            border-radius: 4px;
            font-size: 0.95em;
        }

        .try-it-box {
            max-width: 1100px;
            margin: 0 auto 24px auto;
            background: rgba(255,255,255,0.04);
            border-radius: 14px;
            border: 1px solid rgba(255,255,255,0.08);
            padding: 18px 20px;
        }
        .try-it-row {
            display: flex;
            flex-wrap: wrap;
            align-items: end;
            gap: 16px;
        }
        .try-it-row label {
            display: flex;
            flex-direction: column;
            gap: 4px;
            color: #9ca3af;
            font-size: 0.85em;
        }
        .try-it-row input[type="number"],
        .try-it-row input[type="text"] {
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 8px;
            color: #e5e7eb;
            padding: 8px 10px;
            font-size: 0.95em;
            min-width: 140px;
        }
        .try-it-row .try-checkbox {
            flex-direction: row;
            align-items: center;
            gap: 6px;
            margin-bottom: 1px;
        }
        .try-it-row button {
            background: #4ade80;
            color: #052e16;
            border: none;
            border-radius: 8px;
            padding: 9px 18px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.95em;
        }
        .try-it-row button:hover { background: #6ee7a0; }
        .try-result {
            margin-top: 14px;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 0.9em;
            display: none;
        }
        .try-result.show { display: block; }
        .try-result.autonomous { background: rgba(34,197,94,0.12); border: 1px solid rgba(34,197,94,0.4); color: #4ade80; }
        .try-result.escalation_required { background: rgba(245,158,11,0.12); border: 1px solid rgba(245,158,11,0.4); color: #fbbf24; }
        .try-result.rejected { background: rgba(239,68,68,0.12); border: 1px solid rgba(239,68,68,0.4); color: #f87171; }
        .try-result .verdict-line { font-weight: 700; text-transform: uppercase; margin-bottom: 6px; }
        .try-result .reason-line { color: #d1d5db; }
        .try-result .note-line { color: #6b7280; font-size: 0.85em; margin-top: 8px; }

        .policy-feed {
            font-family: 'Cascadia Code', 'Fira Code', monospace;
            max-height: 360px;
            overflow-y: auto;
        }
        .policy-line {
            padding: 6px 18px;
            font-size: 0.82em;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            white-space: pre-wrap;
            word-break: break-all;
        }
        .policy-line.allowed { color: #4ade80; }
        .policy-line.denied { color: #f87171; font-weight: 600; }
        .policy-line.other { color: #9ca3af; }

        .escalation-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(10, 5, 5, 0.92);
            z-index: 999;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(4px);
        }
        .escalation-overlay.show {
            display: flex;
            animation: flashIn 0.4s ease;
        }
        @keyframes flashIn {
            0% { background: rgba(239,68,68,0.9); }
            100% { background: rgba(10, 5, 5, 0.92); }
        }
        .escalation-box {
            text-align: center;
            border: 2px solid #ef4444;
            border-radius: 16px;
            padding: 40px 60px;
            background: rgba(20,5,5,0.6);
            box-shadow: 0 0 60px rgba(239,68,68,0.5);
        }
        .escalation-title {
            color: #ef4444;
            font-size: 1.8em;
            font-weight: 700;
            letter-spacing: 0.04em;
            margin-bottom: 18px;
            animation: pulse 1.2s infinite;
        }
        .escalation-desc { color: #fca5a5; font-size: 1.3em; margin-bottom: 8px; }
        .escalation-amount { color: #fff; font-size: 2.4em; font-weight: 700; font-family: monospace; margin-bottom: 20px; }
        .escalation-sub { color: #d1d5db; font-size: 0.95em; line-height: 1.5; }

        /* ---- app shell: top bar + 3-column layout ---- */
        body { padding: 0; }
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 28px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            background: rgba(255,255,255,0.02);
        }
        .top-bar-brand { display: flex; align-items: center; gap: 10px; }
        .top-bar-logo {
            width: 30px; height: 30px;
            border-radius: 7px;
            background: linear-gradient(135deg, #76b900, #4b5e1f);
            display: flex; align-items: center; justify-content: center;
            font-weight: 800; color: #0a0e27; font-size: 0.95em;
        }
        .top-bar-name { font-weight: 700; color: #f5f5f5; font-size: 1.05em; letter-spacing: -0.01em; }
        .top-bar-tag { color: #6b7280; font-size: 0.72em; letter-spacing: 0.08em; text-transform: uppercase; }
        .top-bar-badges { display: flex; gap: 10px; flex-wrap: wrap; }
        .top-bar-badge {
            display: flex; align-items: center; gap: 6px;
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 8px;
            padding: 6px 12px;
            font-size: 0.78em;
            color: #9ca3af;
        }
        .top-bar-badge .dot { width: 7px; height: 7px; border-radius: 50%; background: #9fd35c; }
        .top-bar-badge .sub { color: #6b7280; font-size: 0.85em; }

        .shell-grid {
            display: grid;
            grid-template-columns: 260px 1fr 380px;
            gap: 0;
            min-height: calc(100vh - 70px);
            max-width: 1700px;
            margin: 0 auto;
        }
        @media (max-width: 1300px) {
            .shell-grid { grid-template-columns: 1fr; }
        }

        .left-rail {
            border-right: 1px solid rgba(255,255,255,0.08);
            padding: 22px 16px;
        }
        .left-rail-heading {
            color: #6b7280;
            font-size: 0.7em;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            font-weight: 700;
            margin: 0 8px 12px;
        }
        .left-rail .process-diagram { flex-direction: column; gap: 8px; }
        .left-rail .process-step { min-width: unset; max-width: unset; padding: 12px 14px; }
        .left-rail .process-desc { display: none; }
        .left-rail .process-arrow { display: none; }
        .left-rail-metrics { margin-top: 22px; padding: 0 8px; }
        .left-rail-metric { padding: 10px 0; border-top: 1px solid rgba(255,255,255,0.06); }
        .left-rail-metric:first-child { border-top: none; }
        .left-rail-metric .label { color: #6b7280; font-size: 0.72em; letter-spacing: 0.05em; text-transform: uppercase; margin-bottom: 3px; }
        .left-rail-metric .value { color: #e5e7eb; font-weight: 700; font-size: 1em; }

        .center-col { padding: 36px 36px 10px; }
        .center-col .hero { max-width: unset; margin: 0 0 28px; text-align: left; padding: 0; }
        .center-col .hero-sub { max-width: unset; margin: 0 0 24px; }
        .center-col .spec-strip { margin-bottom: 0; }

        .right-terminal {
            border-left: 1px solid rgba(255,255,255,0.08);
            background: rgba(0,0,0,0.18);
            padding: 0;
            display: flex;
            flex-direction: column;
        }
        .terminal-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 12px 16px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            font-family: 'SF Mono', Monaco, monospace;
            font-size: 0.78em;
            color: #9ca3af;
        }
        .terminal-header .dots { display: flex; gap: 5px; }
        .terminal-header .dots span { width: 9px; height: 9px; border-radius: 50%; }
        .terminal-header .dots span:nth-child(1) { background: #ef4444; }
        .terminal-header .dots span:nth-child(2) { background: #f5c850; }
        .terminal-header .dots span:nth-child(3) { background: #9fd35c; }
        .terminal-section-label {
            padding: 10px 16px 6px;
            color: #6b7280;
            font-size: 0.68em;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            font-weight: 700;
        }
        .right-terminal .feed { margin: 0 12px 10px; max-height: 220px; }
        .right-terminal .feed.policy-feed { max-height: 180px; }
        .right-terminal .event, .right-terminal .policy-line { font-size: 0.74em; }
        .below-shell { max-width: 1700px; margin: 0 auto; padding: 10px 36px 40px; }
</head>
<body>
    <div class="top-bar">
        <div class="top-bar-brand">
            <div class="top-bar-logo">C</div>
            <div>
                <div class="top-bar-name">Custodian</div>
                <div class="top-bar-tag">Autonomous Spend Authority</div>
            </div>
        </div>
        <div class="top-bar-badges">
            <div class="top-bar-badge"><span class="dot"></span> NemoClaw <span class="sub">kernel sandbox</span></div>
            <div class="top-bar-badge"><span class="dot"></span> Nous Hermes Agent</div>
            <div class="top-bar-badge"><span class="dot"></span> Stripe <span class="sub">real PaymentIntents</span></div>
        </div>
    </div>

    <div class="shell-grid">
        <aside class="left-rail">
            <div class="left-rail-heading">Pipeline</div>
            <div class="process-diagram">
                <div class="process-step" id="stage-observe"><span class="stage-dot"></span>
                    <div class="process-num">01</div>
                    <div class="process-title">OBSERVE</div>
                    <div class="process-status" id="status-observe"></div>
                </div>
                <div class="process-step" id="stage-judge"><span class="stage-dot"></span>
                    <div class="process-num">02</div>
                    <div class="process-title">JUDGE</div>
                    <div class="process-status" id="status-judge"></div>
                </div>
                <div class="process-step" id="stage-act"><span class="stage-dot"></span>
                    <div class="process-num">03</div>
                    <div class="process-title" id="title-act">ACT or ESCALATE</div>
                    <div class="process-status" id="status-act"></div>
                </div>
                <div class="process-step" id="stage-verify"><span class="stage-dot"></span>
                    <div class="process-num">04</div>
                    <div class="process-title">VERIFY</div>
                    <div class="process-status" id="status-verify"></div>
                </div>
                <div class="process-step" id="stage-prove"><span class="stage-dot"></span>
                    <div class="process-num">05</div>
                    <div class="process-title">PROVE</div>
                    <div class="process-status" id="status-prove"></div>
                </div>
            </div>
            <div class="left-rail-metrics">
                <div class="left-rail-metric"><div class="label">Authority Band</div><div class="value" id="band-value">—</div></div>
                <div class="left-rail-metric"><div class="label">Per-Action Cap</div><div class="value" id="cap-value">—</div></div>
                <div class="left-rail-metric">
                    <div class="label">Autonomous Spend (session)</div>
                    <div class="value" id="session-value">—</div>
                    <div class="bar-track"><div class="bar-fill" id="session-bar" style="width:0%"></div></div>
                    <div class="sub-note" id="override-note"></div>
                </div>
                <div class="left-rail-metric"><div class="label">Sandbox</div><div class="value"><span class="conn-dot down" id="conn-dot"></span><span id="conn-text">checking…</span></div></div>
            </div>
        </aside>

        <main class="center-col">
            <div class="hero">
                <h1 class="hero-claim">The first AI agent you can hand a real wallet to.</h1>
                <div class="hero-sub">Custodian is the trust layer underneath: kernel-enforced authority, not a promise in a prompt. The agent itself cannot exceed its limit or approve its own escalation — even if it tries. Below: a real agent proving it, live, on real infrastructure.</div>
                <div class="spec-strip" id="spec-strip">
                    <span class="spec-item">AUTHORITY <strong id="spec-band">—</strong></span>
                    <span class="spec-sep">·</span>
                    <span class="spec-item">PER-ACTION <strong id="spec-cap">—</strong></span>
                    <span class="spec-sep">·</span>
                    <span class="spec-item">SESSION <strong id="spec-session">—</strong></span>
                    <span class="spec-sep">·</span>
                    <span class="spec-item enforced">ENFORCED AT KERNEL LEVEL</span>
                </div>
            </div>

            <div class="verdict-grid">
                <div class="verdict-card" id="verdict-ops">
                    <div class="verdict-lens">OPS / INFRA — would this break something?</div>
                    <div class="verdict-headline" id="verdict-ops-headline">—</div>
                    <div class="verdict-fact-row"><span class="verdict-fact-key">signal:</span><span class="verdict-fact-val" id="verdict-ops-signal">—</span></div>
                    <div class="verdict-fact-row"><span class="verdict-fact-key">source:</span><span class="verdict-fact-val">10.0.0.199:8093 (real infra API)</span></div>
                    <span class="verdict-badge idle" id="verdict-ops-badge">—</span>
                </div>
                <div class="verdict-card" id="verdict-finance">
                    <div class="verdict-lens">FINANCE — is it worth the cost?</div>
                    <div class="verdict-headline" id="verdict-finance-headline">—</div>
                    <div class="verdict-fact-row"><span class="verdict-fact-key">amount:</span><span class="verdict-fact-val" id="verdict-finance-amount">—</span></div>
                    <div class="verdict-fact-row"><span class="verdict-fact-key">artifact:</span><span class="verdict-fact-val" id="verdict-finance-artifact">—</span></div>
                    <span class="verdict-badge idle" id="verdict-finance-badge">—</span>
                </div>
                <div class="verdict-card" id="verdict-security">
                    <div class="verdict-lens">SECURITY — does kernel policy allow it?</div>
                    <div class="verdict-headline" id="verdict-security-headline">—</div>
                    <div class="verdict-fact-row"><span class="verdict-fact-key">enforcement:</span><span class="verdict-fact-val">kernel (Landlock + OPA)</span></div>
                    <div class="verdict-fact-row"><span class="verdict-fact-key">artifact:</span><span class="verdict-fact-val" id="verdict-security-artifact">—</span></div>
                    <span class="verdict-badge idle" id="verdict-security-badge">—</span>
                </div>
            </div>
        </main>

        <aside class="right-terminal">
            <div class="terminal-header">
                <div class="dots"><span></span><span></span><span></span></div>
                <div>custodian-live$</div>
            </div>
            <div class="terminal-section-label">Live Audit Feed — Ops Decisions &amp; Spend</div>
            <div class="feed" id="feed">
                <div class="empty-state">Waiting for events…</div>
            </div>
            <div class="terminal-section-label">Kernel Policy — Raw OCSF (NemoClaw / OpenShell)</div>
            <div class="feed policy-feed" id="policy-feed">
                <div class="empty-state">Waiting for sandbox activity…</div>
            </div>
        </aside>
    </div>

    <div class="below-shell">
    <div class="pending-banner" id="pending-banner"></div>

    <div class="section-title">Try It Yourself — Live Decision Engine</div>
    <div class="footer-note" style="margin-top:-8px; margin-bottom:16px;">
        This calls the real <code>decide()</code> function from <code>custodian/policy/evaluator.py</code>,
        live, against an isolated sandbox state. Nothing here ever touches real money, sends a real SMS,
        or affects the live data shown above.
    </div>
    <div class="try-it-box">
        <div class="try-it-row">
            <label>Amount ($)<input type="number" id="try-amount" value="1.00" step="0.01" min="0.01"></label>
            <label>Description<input type="text" id="try-description" value="Test request" maxlength="100"></label>
            <label class="try-checkbox"><input type="checkbox" id="try-critical"> Mark as critical</label>
            <button id="try-submit">Decide</button>
        </div>
        <div id="try-result" class="try-result"></div>
    </div>

    <div class="try-it-box" style="margin-top:16px;">
        <div class="try-it-row">
            <label>Approval code<input type="text" id="try-code" placeholder="e.g. 123456" maxlength="32"></label>
            <button id="try-approve-submit">Try to approve</button>
        </div>
        <div id="try-approve-result" class="try-result"></div>
    </div>

    <div class="footer-note">Reading real-time state from the NemoClaw sandbox · refreshes every 3s</div>
    </div>

    <div class="escalation-overlay" id="escalation-overlay">
        <div class="escalation-box">
            <div class="escalation-title">⚠ ESCALATION — HUMAN APPROVAL REQUIRED</div>
            <div class="escalation-desc" id="escalation-desc"></div>
            <div class="escalation-amount" id="escalation-amount"></div>
            <div class="escalation-sub">This exceeds the agent's autonomous authority band.<br>A one-time approval code has been dispatched to the human operator.</div>
        </div>
    </div>

    <script>
        const fmtUSD = (n) => '$' + Number(n).toFixed(2);
        const fmtTime = (iso) => iso ? iso.replace('T', ' ').replace('Z', '') : '';

        function renderEvent(ev) {
            const badgeClass = ev.event || 'unknown';
            const label = (ev.event || 'unknown').replace(/_/g, ' ');
            return `<div class="event">
                <div class="ts">${fmtTime(ev.iso)}</div>
                <div class="badge ${badgeClass}">${label}</div>
                <div class="desc">${ev.description || ''}</div>
                <div class="amount">${ev.amount != null ? fmtUSD(ev.amount) : ''}</div>
            </div>`;
        }

        function renderPolicyLine(line) {
            let cls = 'other';
            if (/\bALLOWED\b/.test(line)) cls = 'allowed';
            else if (/\bDENIED\b/.test(line)) cls = 'denied';
            // Strip the leading ISO timestamp+container prefix Docker adds, keep the OCSF payload.
            const cleaned = line.replace(/^\S+\s+/, '');
            return `<div class="policy-line ${cls}">${cleaned}</div>`;
        }

        async function poll() {
            try {
                const res = await fetch('/api/v1/hermes/summary');
                const data = await res.json();

                const auth = data.authority || {};
                const connected = !!auth.connected;

                document.getElementById('conn-dot').className = 'conn-dot ' + (connected ? 'live' : 'down');
                document.getElementById('conn-text').textContent = connected ? 'Connected' : 'Unreachable';

                document.getElementById('band-value').textContent = auth.band || '—';
                document.getElementById('cap-value').textContent = auth.per_action_cap != null ? fmtUSD(auth.per_action_cap) : '—';

                const autonomous = auth.autonomous_spent || 0;
                const overrides = auth.approved_override_spent || 0;
                const sessionCap = auth.session_cap || 1;
                const pct = Math.min(100, (autonomous / sessionCap) * 100);
                document.getElementById('session-value').textContent = `${fmtUSD(autonomous)} / ${fmtUSD(sessionCap)}`;
                const bar = document.getElementById('session-bar');
                bar.style.width = pct + '%';
                bar.className = 'bar-fill' + (pct > 80 ? ' danger' : pct > 50 ? ' warn' : '');

                const overrideNote = document.getElementById('override-note');
                if (overrides > 0) {
                    overrideNote.textContent = `+ ${fmtUSD(overrides)} via human-approved override (outside autonomous ceiling)`;
                    overrideNote.classList.add('has-override');
                } else {
                    overrideNote.textContent = '';
                    overrideNote.classList.remove('has-override');
                }

                document.getElementById('spec-band').textContent = auth.band || '—';
                document.getElementById('spec-cap').textContent = auth.per_action_cap != null ? fmtUSD(auth.per_action_cap) : '—';
                document.getElementById('spec-session').textContent = `${fmtUSD(autonomous)} / ${fmtUSD(sessionCap)}`;

                const pending = data.pending_approvals || {};
                const codes = Object.keys(pending);
                const banner = document.getElementById('pending-banner');
                const overlay = document.getElementById('escalation-overlay');
                if (codes.length > 0) {
                    const rec = pending[codes[0]];
                    banner.textContent = `⚠ Escalation awaiting human approval — ${rec.description} (${fmtUSD(rec.amount)}). Code sent to operator.`;
                    banner.classList.add('show');
                    document.getElementById('escalation-desc').textContent = rec.description;
                    document.getElementById('escalation-amount').textContent = fmtUSD(rec.amount);
                    overlay.classList.add('show');
                } else {
                    banner.classList.remove('show');
                    overlay.classList.remove('show');
                }

                const events = data.audit || [];
                const feed = document.getElementById('feed');
                feed.innerHTML = events.length
                    ? events.map(renderEvent).join('')
                    : '<div class="empty-state">No events yet — waiting for the agent to act.</div>';

                const policyLines = data.policy_log || [];
                const policyFeed = document.getElementById('policy-feed');
                policyFeed.innerHTML = policyLines.length
                    ? policyLines.map(renderPolicyLine).join('')
                    : '<div class="empty-state">No kernel activity yet.</div>';

                const pendingRecForVerdict = codes.length > 0 ? pending[codes[0]] : null;
                renderPipelineStage(events, pendingRecForVerdict);
                renderVerdictPanel(events, policyLines, pendingRecForVerdict);
            } catch (e) {
                document.getElementById('conn-dot').className = 'conn-dot down';
                document.getElementById('conn-text').textContent = 'Error';
            }
        }

        function setStage(name, cls, status) {
            const el = document.getElementById('stage-' + name);
            el.className = 'process-step' + (cls ? ' ' + cls : '');
            const s = document.getElementById('status-' + name);
            if (s) s.textContent = status || '';
        }

        function renderPipelineStage(events, pendingRec) {
            const titleAct = document.getElementById('title-act');
            const descAct = document.getElementById('desc-act');

            if (!events.length && !pendingRec) {
                setStage('observe', 'is-active', 'watching real signals…');
                setStage('judge', '', '');
                setStage('act', '', '');
                setStage('verify', '', '');
                setStage('prove', '', '');
                titleAct.textContent = 'ACT or ESCALATE';
                descAct.textContent = 'In-band: executes autonomously via real Stripe. Over-band: blocked at the kernel level, a one-time code goes to a human.';
                return;
            }

            setStage('observe', 'is-complete', 'real signals read');
            setStage('judge', 'is-complete', 'judgment made');

            if (pendingRec) {
                titleAct.textContent = 'ESCALATED';
                descAct.textContent = `Over authority — kernel blocked autonomous execution of ${fmtUSD(pendingRec.amount)}.`;
                setStage('act', 'is-complete', 'ceiling hit, blocked');
                setStage('verify', 'is-active', 'awaiting real Twilio code…');
                setStage('prove', '', '');
                return;
            }

            const latest = events[0];
            if (latest.event === 'executed' && latest.approved_by) {
                titleAct.textContent = 'ESCALATED';
                descAct.textContent = 'Over authority — blocked until a real human verified.';
                setStage('act', 'is-complete', 'ceiling hit, blocked');
                setStage('verify', 'is-complete', `approved by ${latest.approved_by}`);
                setStage('prove', 'is-complete', 'logged + kernel trace below');
            } else if (latest.event === 'executed') {
                titleAct.textContent = 'ACTED';
                descAct.textContent = 'Within authority — executed autonomously via real Stripe, no human needed.';
                setStage('act', 'is-complete', 'executed autonomously');
                setStage('verify', 'is-skipped', 'not needed — in band');
                setStage('prove', 'is-complete', 'logged + kernel trace below');
            } else if (latest.event === 'escalation_required') {
                titleAct.textContent = 'ESCALATED';
                descAct.textContent = 'Over authority — kernel blocked it. Approval window expired or still pending.';
                setStage('act', 'is-complete', 'ceiling hit, blocked');
                setStage('verify', '', 'no response yet');
                setStage('prove', 'is-complete', 'logged + kernel trace below');
            } else {
                titleAct.textContent = 'NO ACTION';
                descAct.textContent = 'Judged that nothing warranted real spend — correctly doing nothing, not nothing happening.';
                setStage('act', 'is-complete', 'declined to spend');
                setStage('verify', 'is-skipped', 'not needed');
                setStage('prove', 'is-complete', 'logged + kernel trace below');
            }
        }

        function truncateLine(s, n) {
            if (!s) return '—';
            return s.length > n ? s.slice(0, n) + '…' : s;
        }

        function setVerdict(lens, headline, badgeCls, badgeText, fields) {
            document.getElementById(`verdict-${lens}-headline`).textContent = headline;
            const badge = document.getElementById(`verdict-${lens}-badge`);
            badge.className = 'verdict-badge ' + badgeCls;
            badge.textContent = badgeText;
            for (const [id, val] of Object.entries(fields || {})) {
                const el = document.getElementById(id);
                if (el) el.textContent = val;
            }
        }

        function renderVerdictPanel(events, policyLines, pendingRec) {
            const latestPolicy = policyLines.length ? truncateLine(policyLines[0], 70) : '—';

            if (!events.length && !pendingRec) {
                setVerdict('ops', 'No real signals indicate a problem right now.', 'idle', 'WATCHING',
                    {'verdict-ops-signal': 'last check came back healthy'});
                setVerdict('finance', 'Nothing at stake — no spend judged necessary.', 'idle', 'IDLE',
                    {'verdict-finance-amount': '$0.00', 'verdict-finance-artifact': '—'});
                setVerdict('security', 'Kernel watching, nothing to enforce yet.', 'idle', 'IDLE',
                    {'verdict-security-artifact': latestPolicy});
                return;
            }

            if (pendingRec) {
                setVerdict('ops', 'Judged this needs more than a routine response.', 'hold', 'ACTION JUDGED',
                    {'verdict-ops-signal': pendingRec.description});
                setVerdict('finance', `${fmtUSD(pendingRec.amount)} exceeds autonomous authority — held until a real human verifies.`, 'hold', 'HOLD',
                    {'verdict-finance-amount': fmtUSD(pendingRec.amount), 'verdict-finance-artifact': 'pending_approval.json (real, on disk)'});
                setVerdict('security', 'Kernel blocked autonomous execution outright — a real human is required.', 'blocked', 'BLOCKED',
                    {'verdict-security-artifact': latestPolicy});
                return;
            }

            const latest = events[0];
            if (latest.event === 'executed' && latest.approved_by) {
                setVerdict('ops', 'Confirmed real risk — a human signed off on intervention.', 'pass', 'ACTION TAKEN',
                    {'verdict-ops-signal': latest.description});
                setVerdict('finance', `${fmtUSD(latest.amount)} approved by ${latest.approved_by}, outside the autonomous ceiling.`, 'pass', 'APPROVED',
                    {'verdict-finance-amount': fmtUSD(latest.amount), 'verdict-finance-artifact': latest.payment_intent_id || '—'});
                setVerdict('security', "Real Twilio Verify code consumed — the only path past the kernel block.", 'pass', 'VERIFIED',
                    {'verdict-security-artifact': latestPolicy});
            } else if (latest.event === 'executed') {
                setVerdict('ops', 'A real, judged risk — handled within budget, no human needed.', 'pass', 'ACTION TAKEN',
                    {'verdict-ops-signal': latest.description});
                setVerdict('finance', `${fmtUSD(latest.amount)} spent autonomously, inside authority.`, 'pass', 'WITHIN BUDGET',
                    {'verdict-finance-amount': fmtUSD(latest.amount), 'verdict-finance-artifact': latest.payment_intent_id || '—'});
                setVerdict('security', 'Real Stripe call allowed by kernel policy — see trace below.', 'pass', 'ALLOWED',
                    {'verdict-security-artifact': latestPolicy});
            } else if (latest.event === 'escalation_required') {
                setVerdict('ops', 'Judged action was needed, but no human responded in time.', 'hold', 'EXPIRED',
                    {'verdict-ops-signal': latest.description});
                setVerdict('finance', `${fmtUSD(latest.amount)} held — approval window closed.`, 'hold', 'EXPIRED',
                    {'verdict-finance-amount': fmtUSD(latest.amount), 'verdict-finance-artifact': '—'});
                setVerdict('security', 'Kernel held the block for the entire window — no override occurred.', 'blocked', 'BLOCKED',
                    {'verdict-security-artifact': latestPolicy});
            } else {
                setVerdict('ops', "Signals didn't justify intervention — correctly doing nothing.", 'pass', 'NO ACTION NEEDED',
                    {'verdict-ops-signal': latest.description || 'healthy'});
                setVerdict('finance', '$0 spent — judged not worth it.', 'pass', 'NO SPEND',
                    {'verdict-finance-amount': '$0.00', 'verdict-finance-artifact': '—'});
                setVerdict('security', 'No tool calls required enforcement this round.', 'idle', 'N/A',
                    {'verdict-security-artifact': latestPolicy});
            }
        }

        poll();
        setInterval(poll, 3000);

        document.getElementById('try-submit').addEventListener('click', async () => {
            const amount = parseFloat(document.getElementById('try-amount').value);
            const description = document.getElementById('try-description').value;
            const critical = document.getElementById('try-critical').checked;
            const resultBox = document.getElementById('try-result');
            resultBox.className = 'try-result show';
            resultBox.textContent = 'Deciding…';
            try {
                const res = await fetch('/api/v1/playground/decide', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ amount, description, critical }),
                });
                const data = await res.json();
                if (!res.ok) {
                    resultBox.className = 'try-result rejected show';
                    resultBox.textContent = data.error || 'Request failed.';
                    return;
                }
                resultBox.className = `try-result ${data.verdict} show`;
                resultBox.innerHTML = `
                    <div class="verdict-line">${data.verdict.replace(/_/g, ' ')} — band ${data.band}</div>
                    <div class="reason-line">${data.reason}</div>
                    <div class="note-line">${data.note}</div>
                `;
            } catch (e) {
                resultBox.className = 'try-result rejected show';
                resultBox.textContent = 'Could not reach the decision engine.';
            }
        });

        document.getElementById('try-approve-submit').addEventListener('click', async () => {
            const code = document.getElementById('try-code').value;
            const resultBox = document.getElementById('try-approve-result');
            resultBox.className = 'try-result show';
            resultBox.textContent = 'Checking…';
            try {
                const res = await fetch('/api/v1/playground/try-approve', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code }),
                });
                const data = await res.json();
                resultBox.className = 'try-result rejected show';
                resultBox.innerHTML = `<div class="verdict-line">${data.approved ? 'approved' : 'rejected'}</div><div class="reason-line">${data.message}</div>`;
            } catch (e) {
                resultBox.className = 'try-result rejected show';
                resultBox.textContent = 'Could not reach the approval endpoint.';
            }
        });
    </script>
