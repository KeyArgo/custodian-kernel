[project]
name = "custodian-kernel"
version = "0.4.0"
description = "Kernel-enforced authority and spend platform for AI agents"
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "InovinLabs", email = "hello@inovinlabs.com"},
]
keywords = ["ai", "agent", "authority", "spend", "kernel", "enforcement"]
dependencies = [
    "pyyaml",
    "requests",
    # Required by the paladin credential vault (scrypt + AES-256-GCM) and the
    # talaria `vault` subcommands, both of which ship console scripts. Kept in
    # base deps (not an optional extra) so `pip install custodian-kernel` gives
    # a working `paladin`/`talaria` instead of a command that raises
    # CryptoUnavailableError on first real use.
    "cryptography>=42.0",
    # zoneinfo reads the OS tz database, which Windows does not have at all and
    # slim container images (including our own python:3.13-slim base) do not
    # reliably carry — so timezone-lookup failed with "No time zone found with
    # key America/New_York" while passing on a developer's full Linux box.
    # Declared unconditionally rather than `; sys_platform == "win32"`: ~500KB
    # buys identical behaviour on every platform we ship to.
    "tzdata",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.urls]
Homepage = "https://getcustodian.xyz"
Repository = "https://github.com/KeyArgo/custodian-kernel"
Documentation = "https://getcustodian.xyz/docs"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "flask",
]
# paladin is standalone -- it has zero imports from talaria or any
# integration package, and never will (see docs/TALARIA.md's "brand
# neutral" note). Integration packages depend on paladin, not the
# other way around, so their extras pull paladin in via a self-reference
# rather than duplicating "cryptography>=42.0" in each one. talaria is
# the first; a future Claude/Codex integration package follows the same
# pattern: its own extra just lists "custodian-kernel[paladin]".
paladin = [
    "cryptography>=42.0",
]
talaria = [
    "custodian-kernel[paladin]",
    "flask>=3.0",
]

[project.scripts]
custodian = "custodian.cli.main:main"
custodian-verify = "custodian.verify_kit:main"
paladin = "paladin.cli:main"
paladin-import = "paladin.cli:main_import"
talaria = "talaria.cli:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["custodian*", "paladin*", "talaria*"]

[tool.setuptools.package-data]
"custodian" = ["bundled_skills/**/*", "bundled_skills/**", "packs/**/corpus/*.json", "packs/**/*.yaml", "packs/**/*.json", "policy/presets/*.yaml"]
"talaria" = ["hermes_plugin/plugin.yaml", "hermes_plugin/*.py"]

[tool.pytest.ini_options]
addopts = "-m 'not network'"
markers = [
    "network: marks tests that require real network access (deselected by default; run with -m network to include)",
]
